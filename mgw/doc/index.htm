                { type: "page", id: "attach_instance", title: "attach instance", icon: "📄" },
                { type: "page", id: "detach_instance", title: "detach instance", icon: "📄" },

            ]
        },
        {
            type: "folder", title: "组件说明", icon: "📂", defaultExpanded: false,
            children: [
                { type: "folder", title: "cluster组件", icon: "📂", defaultExpanded: false,
                    children: [
                        { type: "page", id: "mgw_ip_cluster", title: "ip_cluster", icon: "📄" },

                    ]

                { type: "folder", title: "traffic组件", icon: "📂", defaultExpanded: false,
                    children: [

                    ]
                },
                { type: "folder", title: "pipe组件", icon: "📂", defaultExpanded: false,
                    children: [

                        { type: "page", id: "mgw_drop_pipe", title: "drop_pipe", icon: "📄" },
                        { type: "page", id: "mgw_not_pipe", title: "not_pipe", icon: "📄" },

                    ]
                },
                { type: "folder", title: "leaf组件", icon: "📂", defaultExpanded: false,
                    children: [
                        { type: "page", id: "mgw_ip_printer_leaf", title: "ip_printer_leaf", icon: "📄" },
                        { type: "page", id: "mgw_drop_leaf", title: "drop_leaf", icon: "📄" },
                        { type: "page", id: "mgw_drop_syn_leaf", title: "drop_syn_leaf", icon: "📄" },
                        { type: "page", id: "mgw_pass_syn_leaf", title: "pass_syn_leaf", icon: "📄" },
                        { type: "page", id: "mgw_ethtx_leaf", title: "ethtx_leaf", icon: "📄" },
                        { type: "page", id: "mgw_iptx_leaf", title: "iptx_leaf", icon: "📄" },
                        { type: "page", id: "mgw_setdscp_leaf", title: "setdscp_leaf", icon: "📄" },
                        { type: "page", id: "mgw_ip_acl_leaf", title: "ip_acl_leaf", icon: "📄" },
                        { type: "page", id: "mgw_url_filter_leaf", title: "url_filter_leaf", icon: "📄" },
                        { type: "page", id: "mgw_lua_leaf", title: "lua_leaf", icon: "📄" },
                        { type: "page", id: "mgw_xdp_event_leaf", title: "xdp_event_leaf", icon: "📄" },
                    ]
                },
            ]
        },
    ];

    // ============================================================
    // 构建扁平化页面列表（用于上一篇/下一篇）
    // 深度优先遍历，按照显示顺序
    // ============================================================
    let flatPageList = [];

    function traverseTree(nodes, result) {
        for (const node of nodes) {
            if (node.type === 'page') {
                result.push({ id: node.id, title: node.title });
            }
            if (node.children && node.children.length > 0) {
                traverseTree(node.children, result);
            }
        }
    }

    function buildFlatPageList() {
        flatPageList = [];
        traverseTree(NAV_TREE, flatPageList);
        console.log('页面列表:', flatPageList.map(p => p.title));
    }

    // 渲染树形导航
    function renderTree(nodes) {
        let html = '';
        for (const node of nodes) {
            if (node.type === 'folder') {
                const expandedClass = node.defaultExpanded ? 'expanded' : '';
                const toggleIcon = node.defaultExpanded ? '▼' : '▶';
                html += `<li class="folder ${expandedClass}" data-folder-id="${node.title}">`;
                html += `<div class="node">`;
                html += `<span class="toggle">${toggleIcon}</span>`;
                html += `<span class="icon">${node.icon}</span>`;
                html += `<span class="label">${node.title}</span>`;
                html += `</div>`;
                if (node.children && node.children.length) {
                    html += `<ul>${renderTree(node.children)}</ul>`;
                }
                html += `</li>`;
            } else if (node.type === 'page') {
                html += `<li class="page" data-page="${node.id}">`;
                html += `<div class="node">`;
                html += `<span class="toggle" style="visibility:hidden">•</span>`;
                html += `<span class="icon">${node.icon}</span>`;
                html += `<span class="label">${node.title}</span>`;
                html += `</div></li>`;
            }
        }
        return html;
    }

    function bindTreeEvents() {
        // 文件夹折叠/展开
        document.querySelectorAll('.folder').forEach(folder => {
            const nodeDiv = folder.querySelector(':scope > .node');
            const toggleSpan = nodeDiv?.querySelector('.toggle');
            
            const toggleFolder = (e) => {
                e?.stopPropagation();
                const isExpanded = folder.classList.contains('expanded');
                if (isExpanded) {
                    folder.classList.remove('expanded');
                    if (toggleSpan) toggleSpan.textContent = '▶';
                } else {
                    folder.classList.add('expanded');
                    if (toggleSpan) toggleSpan.textContent = '▼';
                }
                // 保存状态
                const key = folder.getAttribute('data-folder-id');
                if (key) {
                    const saved = JSON.parse(localStorage.getItem('treeState') || '{}');
                    saved[key] = !isExpanded;
                    localStorage.setItem('treeState', JSON.stringify(saved));
                }
            };
            
            if (nodeDiv) nodeDiv.addEventListener('click', toggleFolder);
            if (toggleSpan) toggleSpan.addEventListener('click', toggleFolder);
        });
        
        // 恢复保存的折叠状态
        const savedState = JSON.parse(localStorage.getItem('treeState') || '{}');
        document.querySelectorAll('.folder').forEach(folder => {
            const key = folder.getAttribute('data-folder-id');
            if (key && savedState.hasOwnProperty(key)) {
                const shouldExpand = savedState[key];
                const toggle = folder.querySelector(':scope > .node .toggle');
                if (shouldExpand && !folder.classList.contains('expanded')) {
                    folder.classList.add('expanded');
                    if (toggle) toggle.textContent = '▼';
                } else if (!shouldExpand && folder.classList.contains('expanded')) {
                    folder.classList.remove('expanded');
                    if (toggle) toggle.textContent = '▶';
                }
            }
        });
        
        // 页面点击
        document.querySelectorAll('.page').forEach(page => {
            const nodeDiv = page.querySelector('.node');
            nodeDiv?.addEventListener('click', (e) => {
                e.stopPropagation();
                const pageId = page.getAttribute('data-page');
                if (pageId) loadPage(pageId);
            });
        });
    }

    function loadPage(pageId) {
        const url = `pages/${pageId}.htm`;
        document.getElementById('contentArea').innerHTML = `<iframe class="content-frame" src="${url}" title="文档内容"></iframe>`;
        updateActiveNav(pageId);
        history.pushState(null, '', `#${pageId}`);
    }

    function updateActiveNav(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const active = document.querySelector(`.page[data-page="${pageId}"]`);
        if (active) active.classList.add('active');
    }

    // 监听来自 iframe 的消息
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'nav' && event.data.page) {
            loadPage(event.data.page);
        }
    });

    // 初始化
    function init() {
        buildFlatPageList();
        const treeHtml = renderTree(NAV_TREE);
        document.getElementById('navTree').innerHTML = treeHtml;
        bindTreeEvents();
        
        let start = 'what_is_mgw';
        const hash = location.hash.slice(1);
        // 检查页面是否存在
        if (hash && flatPageList.some(p => p.id === hash)) start = hash;
        loadPage(start);
    }
    
    window.addEventListener('hashchange', () => {
        const hash = location.hash.slice(1);
        if (hash && flatPageList.some(p => p.id === hash)) loadPage(hash);
        else loadPage('fast_start');
    });
    
    init();
</script>

<script src="/js/base.js"></script>
