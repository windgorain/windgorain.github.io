    <h1>什么是MGW</h1>
    <p> MGW 是一款Linux内核流量编排工具，旨在帮助用户快速编排出内核功能。</p>

    <h2>技术特点</h2>
    <p>
        <li>快速开发验证：简化开发过程，快速搭建原型，验证可行性。</li>
        <li>高性能网络应用：MGW在内核最接近硬件层次工作, 无用户态切换消耗, 性能高、延迟低。</li>
        <li>灰度测试：MGW支持对部分流量进行灰度，稳定后一键切换到主路径。</li>
        <li>无感升级：MGW可在线升级组件，不中断流量。</li>
    </p>
