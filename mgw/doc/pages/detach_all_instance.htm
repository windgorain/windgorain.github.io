    <h1>detach all-instance</h1>

    <p> 解关联指定实例的所有下游实例</p>
    <p>命令格式: sudo ./mgwtool detach all-instance -t 目标实例 </p>
    <p>示例: </p>
<pre><p class="code">$ sudo ./mgwtool tree instance
c1
├── p1
└── p2

$ sudo ./mgwtool detach all-instance -t c1
$ sudo ./mgwtool tree instance
c1
p1
p2
</p></pre>
