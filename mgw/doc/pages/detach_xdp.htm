    <h1>detach xdp</h1>

    <p>从接口解关联XDP</p>
    <p>命令格式: sudo ./mgwtool detach xdp -t 接口名 </p>
    <p>示例: </p>
<pre><p class="code">$ sudo ./mgwtool tree instance
[eth0]
└── c1
$ sudo ./mgwtool detach xdp -t eth0
$ sudo ./mgwtool tree instance
c1
</p></pre>
    <p> 可以看到实例c1和接口eth0已经解除了关系 </p>
