    <h1>MGW组件类型</h1>
    <p> MGW组件分为Cluster、Traffic、Pipe、Leaf四种不同类型</p>

    <h2>Cluster类型</h2>
    <p> 对报文进行Hash，根据Hash结果和权重将流量分发给下游不同组件。 </p>

    <h2>Traffic类型</h2>
    <p> 对流量进行调度，根据规则，将不同流量分发给下游不同组件。</p>

    <h2>Pipe类型</h2>
    <p> 对流量进行预处理和后处理，并将报文传递给下游组件。</p>

    <h2>Leaf类型</h2>
    <p> 对流量做最终处理，无下游组件。</p>
