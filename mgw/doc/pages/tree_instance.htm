    <h1>tree instance</h1>

    <p>显示实例之间的关联关系</p>
    <p>命令格式: sudo ./mgwtool tree instance</p>
    <p>示例: </p>
<pre><p class="code">$ sudo ./mgwtool tree instance
[eth0]
└── ttriode
    ├── xdpevent
    └── acl
</p></pre>

    <p>这个拓扑说明eth0接口下关联着"ttriode"实例, "ttriode"实例下关联着两个实例: "xdpevent"和"acl"</p>
