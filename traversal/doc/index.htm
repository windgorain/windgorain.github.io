<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心 · VNMesh </title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/doc.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo"> VNMesh文档中心</div>
        <ul class="tree" id="navTree"></ul>
        <div style="padding: 1rem; font-size: 0.7rem; color: #7c8ea0; border-top: 1px solid #edf2f7; margin-top: 1rem;">
        VNMesh文档中心
        </div>
    </aside>

    <main class="main">
        <div class="content-area" id="contentArea">
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <span style="margin-left: 10px;">加载中...</span>
            </div>
        </div>
        <div class="footer-note">
            <p> <a href="https://beian.miit.gov.cn/" target="_blank" style="color: #94a3b8;"> 京ICP备2026017207号 </a> </p>
            <p>&copy; 2026 VNMesh. 保留所有权利. </p>
        </div>
    </main>
</div>

<script>
    // ============================================================
    // 多级导航配置（支持任意深度嵌套）
    // 每个节点可以有 children 数组，children 中的节点如果有 children 则可继续嵌套
    // 只有 page 类型的节点才会被加载为页面
    // ============================================================
    const NAV_TREE = [
        {
            type: "folder", title: "VNMesh介绍", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "what_is_vnmesh", title: "VNMesh是什么", icon: "📄" },
                { type: "page", id: "why_vnmesh", title: "为什么开发VNMesh", icon: "📄" },
                { type: "page", id: "vnmesh_advantage", title: "VNMesh的优势", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "入门指南", icon: "📂", defaultExpanded: true,
            children: [
                { type: "page", id: "fast_start", title: "快速开始", icon: "📄" },
                { type: "page", id: "install_os", title: "安装VNMesh", icon: "📄" },
                { type: "page", id: "run_vnmesh", title: "运行方式", icon: "📄" },
                { type: "page", id: "how_to_config_client", title: "如何配置客户端", icon: "📄" },
                { type: "page", id: "quit_vnmesh", title: "关闭VNMesh", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "基础配置", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "user_login", title: "用户登录", icon: "📄" },
                { type: "page", id: "sec_config", title: "安全配置", icon: "📄" },
                { type: "page", id: "neighbor", title: "在线设备", icon: "📄" },
                { type: "page", id: "session", title: "会话", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "公网服务", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "public_node", title: "公网节点", icon: "📄" },
                { type: "page", id: "domain_map", title: "域名映射", icon: "📄" },
                { type: "page", id: "domain_map_multi_active", title: "域名映射的灾备多活", icon: "📄" },
                { type: "page", id: "domain_verify", title: "域名所有权验证", icon: "📄" },
                { type: "page", id: "tcp_port_map", title: "TCP端口映射", icon: "📄" },
                { type: "page", id: "dev_map", title: "设备映射", icon: "📄" },
                { type: "page", id: "dev_door", title: "设备门禁", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "用户管理", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "user_mng", title: "用户管理", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "自建服务器", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "self_server_verify", title: "自建服务器认证码", icon: "📄" },
                { type: "page", id: "self_server", title: "服务器", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "ACL", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "ipacl", title: "IPACL", icon: "📄" },
                { type: "page", id: "ip_group", title: "地址组", icon: "📄" },
                { type: "page", id: "port_group", title: "端口组", icon: "📄" },
            ]
        },
        {
            type: "folder", title: "测试报告", icon: "📂", defaultExpanded: false,
            children: [
                { type: "page", id: "test_perf_dev_map", title: "设备映射性能测试报告", icon: "📄" },
            ]
        },
    ];

    // ============================================================
    // 构建扁平化页面列表（用于上一篇/下一篇）
    // 深度优先遍历，按照显示顺序
    // ============================================================
    let flatPageList = [];

    function traverseTree(nodes, result) {
        for (const node of nodes) {
            if (node.type === 'page') {
                result.push({ id: node.id, title: node.title });
            }
            if (node.children && node.children.length > 0) {
                traverseTree(node.children, result);
            }
        }
    }

    function buildFlatPageList() {
        flatPageList = [];
        traverseTree(NAV_TREE, flatPageList);
        console.log('页面列表:', flatPageList.map(p => p.title));
    }

    // 渲染树形导航
    function renderTree(nodes) {
        let html = '';
        for (const node of nodes) {
            if (node.type === 'folder') {
                const expandedClass = node.defaultExpanded ? 'expanded' : '';
                const toggleIcon = node.defaultExpanded ? '▼' : '▶';
                html += `<li class="folder ${expandedClass}" data-folder-id="${node.title}">`;
                html += `<div class="node">`;
                html += `<span class="toggle">${toggleIcon}</span>`;
                html += `<span class="icon">${node.icon}</span>`;
                html += `<span class="label">${node.title}</span>`;
                html += `</div>`;
                if (node.children && node.children.length) {
                    html += `<ul>${renderTree(node.children)}</ul>`;
                }
                html += `</li>`;
            } else if (node.type === 'page') {
                html += `<li class="page" data-page="${node.id}">`;
                html += `<div class="node">`;
                html += `<span class="toggle" style="visibility:hidden">•</span>`;
                html += `<span class="icon">${node.icon}</span>`;
                html += `<span class="label">${node.title}</span>`;
                html += `</div></li>`;
            }
        }
        return html;
    }

    function bindTreeEvents() {
        // 文件夹折叠/展开
        document.querySelectorAll('.folder').forEach(folder => {
            const nodeDiv = folder.querySelector(':scope > .node');
            const toggleSpan = nodeDiv?.querySelector('.toggle');
            
            const toggleFolder = (e) => {
                e?.stopPropagation();
                const isExpanded = folder.classList.contains('expanded');
                if (isExpanded) {
                    folder.classList.remove('expanded');
                    if (toggleSpan) toggleSpan.textContent = '▶';
                } else {
                    folder.classList.add('expanded');
                    if (toggleSpan) toggleSpan.textContent = '▼';
                }
                // 保存状态
                const key = folder.getAttribute('data-folder-id');
                if (key) {
                    const saved = JSON.parse(localStorage.getItem('treeState') || '{}');
                    saved[key] = !isExpanded;
                    localStorage.setItem('treeState', JSON.stringify(saved));
                }
            };
            
            if (nodeDiv) nodeDiv.addEventListener('click', toggleFolder);
            if (toggleSpan) toggleSpan.addEventListener('click', toggleFolder);
        });
        
        // 恢复保存的折叠状态
        const savedState = JSON.parse(localStorage.getItem('treeState') || '{}');
        document.querySelectorAll('.folder').forEach(folder => {
            const key = folder.getAttribute('data-folder-id');
            if (key && savedState.hasOwnProperty(key)) {
                const shouldExpand = savedState[key];
                const toggle = folder.querySelector(':scope > .node .toggle');
                if (shouldExpand && !folder.classList.contains('expanded')) {
                    folder.classList.add('expanded');
                    if (toggle) toggle.textContent = '▼';
                } else if (!shouldExpand && folder.classList.contains('expanded')) {
                    folder.classList.remove('expanded');
                    if (toggle) toggle.textContent = '▶';
                }
            }
        });
        
        // 页面点击
        document.querySelectorAll('.page').forEach(page => {
            const nodeDiv = page.querySelector('.node');
            nodeDiv?.addEventListener('click', (e) => {
                e.stopPropagation();
                const pageId = page.getAttribute('data-page');
                if (pageId) loadPage(pageId);
            });
        });
    }

    function loadPage(pageId) {
        const url = `pages/${pageId}.htm`;
        document.getElementById('contentArea').innerHTML = `<iframe class="content-frame" src="${url}" title="文档内容"></iframe>`;
        updateActiveNav(pageId);
        history.pushState(null, '', `#${pageId}`);
    }

    function updateActiveNav(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const active = document.querySelector(`.page[data-page="${pageId}"]`);
        if (active) active.classList.add('active');
    }

    // 监听来自 iframe 的消息
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'nav' && event.data.page) {
            loadPage(event.data.page);
        }
    });

    // 初始化
    function init() {
        buildFlatPageList();
        const treeHtml = renderTree(NAV_TREE);
        document.getElementById('navTree').innerHTML = treeHtml;
        bindTreeEvents();
        
        let start = 'fast_start';
        const hash = location.hash.slice(1);
        // 检查页面是否存在
        if (hash && flatPageList.some(p => p.id === hash)) start = hash;
        loadPage(start);
    }
    
    window.addEventListener('hashchange', () => {
        const hash = location.hash.slice(1);
        if (hash && flatPageList.some(p => p.id === hash)) loadPage(hash);
        else loadPage('fast_start');
    });
    
    init();
</script>

<script src="/js/base.js"></script>

</body>
</html>
