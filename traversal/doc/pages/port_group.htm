<div class="doc-wrapper">
    <h1>端口组</h1>
    <p> 端口组可以将多个端口义为一个组, 以方便ACL规则引用, 避免配置很多条ACL。 </p>
    <p>配置路径: "ACL-端口组" </p>

    <img src="img/acl/portpool_1.png" height="300">
    <p> 系统默认存在两个端口组, 内容包含常见端口号, 用于ACL </p>
    <p>点击规则名, 可编辑端口组</p>
    <p>点击"新建", 可新建一个端口组</p>

    <img src="img/acl/portpool_2.png" height="120">

    <p> 输入端口组名称后点击下一步, 进入端口规则编辑页面 </p>

    <img src="img/acl/portpool_3.png" height="240">
    <p> 点击新建按钮可添加一个端口段</p>
    <img src="img/acl/portpool_4.png" height="120">
